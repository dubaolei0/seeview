core:
  title: "布局 C 测试"
  statement: "如图，正方形 $ABCD$ 边长为 2，求对角线 $AC$ 的长。"
  say: 正方形 ABCD 边长为 2，求对角线长。
  figure:
    type: schematic
    x_range: [-1, 3]
    y_range: [-1, 3]
    elements:
      - type: polygon
        points: [[0,0],[2,0],[2,2],[0,2]]
        color: "#1F2937"
        stroke_width: 2.5
      - type: line
        x1: 0
        y1: 0
        x2: 2
        y2: 2
        color: "#B91C1C"
        stroke_width: 1.5
        dashed: true
      - type: label
        x: -0.3
        y: 2.2
        text: "$A$"
      - type: label
        x: 2.3
        y: 2.2
        text: "$B$"
      - type: label
        x: 2.3
        y: -0.3
        text: "$C$"
      - type: label
        x: -0.3
        y: -0.3
        text: "$D$"

teach:
  acts:
    - title: "勾股定理"
      transition: none
      beats:
        - say: 用勾股定理。
          show:
            type: step
            body: "$AC = \\sqrt{2^2+2^2}$"
        - say: 算出来。
          show:
            type: answer_box
            body: "$AC = 2\\sqrt{2}$"

summary:
  beats:
    - say: 正方形对角线等于边长根号二。
      show:
        type: takeaway
        body: "对角线 $= a\\sqrt{2}$"
