# 极简布局测试：show_in_read + 解析阶段分步画图
core:
  title: "题目讲解"
  statement: "如图，在 $\\mathrm{Rt}\\triangle ABC$ 中，$\\angle C=90^\\circ$，$AC=3$，$BC=4$。过点 $C$ 作 $CD\\perp AB$，求 $CD$。"
  say: "同学们看这道题。直角三角形ABC中，AC等于三，BC等于四。过C作AB上的高CD，要求CD的长度。"
  figure:
    type: schematic
    show_in_read: true
    x_range: [-0.8, 4.8]
    y_range: [-0.8, 3.8]
    elements:
      # 读题阶段先显示的题干图
      - {type: polygon, points: [[0, 3], [0, 0], [4, 0]], color: "#1F2937", stroke_width: 2.5}
      - {type: polygon, points: [[0, 0], [0.35, 0], [0.35, 0.35], [0, 0.35]], color: "#1F2937", stroke_width: 1.5}
      - {type: label, x: -0.3, y: 3.05, text: "$A$", font_size: 30}
      - {type: label, x: -0.3, y: -0.3, text: "$C$", font_size: 30}
      - {type: label, x: 4.15, y: -0.35, text: "$B$", font_size: 30}
      - {type: label, x: -0.45, y: 1.5, text: "$3$", font_size: 28, color: "#B91C1C"}
      - {type: label, x: 2.0, y: -0.4, text: "$4$", font_size: 28, color: "#B91C1C"}
      # 解析阶段再画出来的元素
      - {type: line, x1: 0, y1: 0, x2: 1.44, y2: 1.92, color: "#2563EB", stroke_width: 3, dashed: true, id: high_cd}
      - {type: dot, x: 1.44, y: 1.92, color: "#2563EB", id: dot_d}
      - {type: label, x: 1.76, y: 2.05, text: "$D$", font_size: 30, color: "#2563EB", id: label_d}
      - {type: polygon, points: [[1.26, 1.68], [1.44, 1.92], [1.68, 1.74], [1.50, 1.50]], color: "#2563EB", stroke_width: 1.6, id: right_d}

teach:
  acts:
    - title: "先把辅助线画出来"
      transition: soft
      beats:
        - say: "读题时我们已经看到原图。现在在图上补出从C到AB的垂线，垂足记作D。"
          show:
            type: figure
            ref: [high_cd, dot_d, label_d, right_d]
            anim: create
        - say: "这一步只是在测试布局效果：题图留在图栏，解析内容在左侧主区继续出现。"
          show:
            type: step
            body: "辅助线：$CD\\perp AB$，垂足为 $D$"

    - title: "简单算一下"
      transition: soft
      beats:
        - say: "先用勾股定理求斜边AB，三四五直角三角形，所以AB等于五。"
          show:
            type: step
            body: "$AB=\\sqrt{3^2+4^2}=5$"
        - say: "再用等面积。直角边算面积，等于斜边乘高算面积。"
          show:
            type: step
            body: "$\\dfrac12\\cdot AC\\cdot BC=\\dfrac12\\cdot AB\\cdot CD$"
        - say: "所以CD等于三乘四除以五，也就是五分之十二。"
          show:
            type: answer_box
            body: "$CD=\\dfrac{AC\\cdot BC}{AB}=\\dfrac{12}{5}$"
