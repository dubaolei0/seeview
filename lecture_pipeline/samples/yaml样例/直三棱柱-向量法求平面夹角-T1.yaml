# 快车道 · 布局E · 分步图像解释
core:
  title: 题目讲解
  statement: '在直三棱柱 $ABC\text{-}A_1B_1C_1$ 中，$AC=CB=2$，$AA_1=3$，$\angle ACB=90^\circ$，$P$ 为 $BC$ 的中点，点 $Q,R$ 分别在棱 $AA_1,BB_1$ 上，$A_1Q=2AQ$，$BR=2RB_1$。求平面 $PQR$ 与平面 $A_1B_1C_1$ 夹角的余弦值。'
  say: '同学们，这道题要在直三棱柱里用向量法求两个平面的夹角。向量法的标准流程是：建系、算坐标、求法向量、最后用法向量点积算夹角。我们一步步来。'
  layout: left_figure
  cover_figure: false
  figure:
    type: schematic
    x_range:
    - 0
    - 4.5
    - 1
    y_range:
    - 0
    - 5.5
    - 1
    elements:
    # ===== 坐标轴（线段 + 小三角箭头）=====
    - type: line
      x1: 1.0
      y1: 0.5
      x2: 4.15
      y2: 0.5
      color: '#EF4444'
      stroke_width: 2
      id: coord_x
    - type: polygon
      points:
      - - 4.3
        - 0.5
      - - 4.1
        - 0.58
      - - 4.1
        - 0.42
      color: '#EF4444'
      fill_color: '#EF4444'
      fill_opacity: 1.0
      stroke_width: 0
      id: arrow_x
    - type: line
      x1: 1.0
      y1: 0.5
      x2: 2.17
      y2: 1.18
      color: '#10B981'
      stroke_width: 2
      id: coord_y
    - type: polygon
      points:
      - - 2.3
        - 1.25
      - - 2.11
        - 1.24
      - - 2.19
        - 1.10
      color: '#10B981'
      fill_color: '#10B981'
      fill_opacity: 1.0
      stroke_width: 0
      id: arrow_y
    - type: line
      x1: 1.0
      y1: 0.5
      x2: 1.0
      y2: 4.15
      color: '#2563EB'
      stroke_width: 2
      id: coord_z
    - type: polygon
      points:
      - - 1.0
        - 4.3
      - - 0.92
        - 4.12
      - - 1.08
        - 4.12
      color: '#2563EB'
      fill_color: '#2563EB'
      fill_opacity: 1.0
      stroke_width: 0
      id: arrow_z
    - type: label
      x: 4.5
      y: 0.5
      text: $x$
      font_size: 16
      color: '#EF4444'
      id: label_x
    - type: label
      x: 2.55
      y: 1.35
      text: $y$
      font_size: 16
      color: '#10B981'
      id: label_y
    - type: label
      x: 1.25
      y: 4.4
      text: $z$
      font_size: 16
      color: '#2563EB'
      id: label_z
    # ===== 棱柱边 =====
    - type: line
      x1: 1.0
      y1: 0.5
      x2: 3.0
      y2: 0.5
      color: '#94A3B8'
      stroke_width: 2
    - type: line
      x1: 1.0
      y1: 0.5
      x2: 1.87
      y2: 1.0
      color: '#94A3B8'
      stroke_width: 2
      dashed: true
    - type: line
      x1: 3.0
      y1: 0.5
      x2: 1.87
      y2: 1.0
      color: '#94A3B8'
      stroke_width: 2
      dashed: true
    - type: line
      x1: 1.0
      y1: 0.5
      x2: 1.0
      y2: 3.5
      color: '#94A3B8'
      stroke_width: 2
    - type: line
      x1: 3.0
      y1: 0.5
      x2: 3.0
      y2: 3.5
      color: '#94A3B8'
      stroke_width: 2
    - type: line
      x1: 1.87
      y1: 1.0
      x2: 1.87
      y2: 4.0
      color: '#94A3B8'
      stroke_width: 2
      dashed: true
    - type: line
      x1: 1.0
      y1: 3.5
      x2: 3.0
      y2: 3.5
      color: '#94A3B8'
      stroke_width: 2
    - type: line
      x1: 3.0
      y1: 3.5
      x2: 1.87
      y2: 4.0
      color: '#94A3B8'
      stroke_width: 2
    - type: line
      x1: 1.0
      y1: 3.5
      x2: 1.87
      y2: 4.0
      color: '#94A3B8'
      stroke_width: 2
    # ===== 顶点标签 =====
    - type: label
      x: 0.65
      y: 0.3
      text: $C$
      font_size: 15
      color: '#111827'
    - type: label
      x: 3.2
      y: 0.3
      text: $A$
      font_size: 15
      color: '#111827'
    - type: label
      x: 2.0
      y: 1.2
      text: $B$
      font_size: 15
      color: '#111827'
    - type: label
      x: 0.6
      y: 3.6
      text: $C_1$
      font_size: 15
      color: '#111827'
    - type: label
      x: 3.2
      y: 3.6
      text: $A_1$
      font_size: 15
      color: '#111827'
    - type: label
      x: 2.0
      y: 4.2
      text: $B_1$
      font_size: 15
      color: '#111827'
    # ===== P 点（BC 中点）=====
    - type: dot
      x: 1.43
      y: 0.75
      color: '#EF4444'
      id: dot_p
    - type: label
      x: 1.55
      y: 0.55
      text: $P$
      font_size: 16
      color: '#EF4444'
      id: label_p
    # ===== Q 点（AA₁ 上，A₁Q=2AQ）=====
    - type: dot
      x: 3.0
      y: 1.5
      color: '#10B981'
      id: dot_q
    - type: label
      x: 3.25
      y: 1.5
      text: $Q$
      font_size: 16
      color: '#10B981'
      id: label_q
    # ===== R 点（BB₁ 上，BR=2RB₁）=====
    - type: dot
      x: 1.87
      y: 3.0
      color: '#2563EB'
      id: dot_r
    - type: label
      x: 1.5
      y: 3.2
      text: $R$
      font_size: 16
      color: '#2563EB'
      id: label_r
    # ===== 平面 PQR =====
    - type: polygon
      points:
      - - 1.43
        - 0.75
      - - 3.0
        - 1.5
      - - 1.87
        - 3.0
      color: '#8B5CF6'
      stroke_width: 2
      fill_color: '#8B5CF6'
      fill_opacity: 0.15
      id: plane_pqr
teach:
  acts:
  - title: 建立空间直角坐标系
    transition: none
    beats:
    - say: 先看左图，这一步把坐标系标出来。
      show:
        type: figure
        ref:
        - coord_x
        - coord_y
        - coord_z
        - arrow_x
        - arrow_y
        - arrow_z
        - label_x
        - label_y
        - label_z
        anim: create
      mode: spotlight
    - say: '以C为原点，CA、CB、CC一三条两两垂直的棱分别为x轴、y轴、z轴，建立空间直角坐标系。AC等于CB等于二，AA一等于三。各顶点坐标：C是原点零零零，A是二零零，B是零二零，C一是零零三，A一是二零三，B一是零二三。'
      show:
        type: step
        body: '$C(0,0,0)$，$A(2,0,0)$，$B(0,2,0)$，$C_1(0,0,3)$，$A_1(2,0,3)$，$B_1(0,2,3)$'
  - title: 求 P、Q、R 坐标
    transition: soft
    beats:
    - say: 先看左图，这一步把P、Q、R三个点标出来。
      show:
        type: figure
        ref:
        - dot_p
        - label_p
        - dot_q
        - label_q
        - dot_r
        - label_r
        anim: create
      mode: spotlight
    - say: P是BC的中点。B是零二零，C是零零零，取中点得P的坐标是零、一、零。
      show:
        type: step
        body: '$P$ 为 $BC$ 中点 $\Rightarrow P(0,1,0)$'
    - say: Q在AA一上，A一Q等于二倍AQ，说明Q距A是AA一的三分之一。A是二零零，A一是二零三，所以Q的坐标是二、零、一。
      show:
        type: step
        body: '$A_1Q = 2AQ$ $\Rightarrow$ $Q$ 在 $AA_1$ 上距 $A$ 为 $\dfrac{1}{3}AA_1$ $\Rightarrow Q(2,0,1)$'
    - say: R在BB一上，BR等于二倍RB一，说明R距B是BB一的三分之二。B是零二零，B一是零二三，所以R的坐标是零、二、二。
      show:
        type: step
        body: '$BR = 2RB_1$ $\Rightarrow$ $R$ 在 $BB_1$ 上距 $B$ 为 $\dfrac{2}{3}BB_1$ $\Rightarrow R(0,2,2)$'
  - title: 求平面 PQR 的法向量
    transition: soft
    beats:
    - say: 先看左图，这一步把平面PQR画出来。
      show:
        type: figure
        ref:
        - plane_pqr
        anim: create
      mode: spotlight
    - say: 先算平面PQR里两个向量。向量PQ等于Q减P，分量是二、负一、一。向量PR等于R减P，分量是零、一、二。
      show:
        type: step
        body: '$\vec{PQ} = (2,-1,1)$，$\vec{PR} = (0,1,2)$'
    - say: 设法向量n的分量是x、y、z。法向量垂直平面里的所有向量，所以n点乘向量PQ等于零，得到二x减y加z等于零；n点乘向量PR等于零，得到y加二z等于零。
      show:
        type: step
        body: '$\vec{n}=(x,y,z)$：$\vec{n}\cdot\vec{PQ}=0 \Rightarrow 2x-y+z=0$，$\vec{n}\cdot\vec{PR}=0 \Rightarrow y+2z=0$'
    - say: 由第二个方程得到y等于负二z。代入第一个方程：二x减负二z加z等于零，就是二x加三z等于零，所以x等于负二分之三z。取z等于二，得到x等于负三，y等于负四。所以法向量n是负三、负四、二。
      show:
        type: step
        body: '$y = -2z$，代入 $2x - (-2z) + z = 0$ $\Rightarrow x = -\dfrac{3}{2}z$，取 $z=2$ $\Rightarrow \vec{n}=(-3,-4,2)$'
  - title: 计算平面夹角
    transition: soft
    beats:
    - say: 平面A一B一C一平行于xy平面，它的法向量n二等于零零一，方向竖直向上。
      show:
        type: step
        body: '平面 $A_1B_1C_1$ 法向量 $\vec{n}_2 = (0,0,1)$'
    - say: 两个平面夹角的余弦值等于两个法向量点积的绝对值除以模的积。n一点乘n二等于负三乘零加负四乘零加二乘一，等于二。n一的模等于根号下九加十六加四，等于根号二十九。n二的模等于一。
      show:
        type: step
        body: '$\cos\theta = \dfrac{|\vec{n}_1 \cdot \vec{n}_2|}{|\vec{n}_1||\vec{n}_2|} = \dfrac{|2|}{\sqrt{29} \times 1} = \dfrac{2}{\sqrt{29}} = \dfrac{2\sqrt{29}}{29}$'
    - say: 所以平面PQR与平面A一B一C一夹角的余弦值是二十九分之二倍根号二十九。
      show:
        type: answer_box
        body: '$\cos\theta = \dfrac{2\sqrt{29}}{29}$'
summary:
  beats:
  - say: 向量法求平面夹角的流程很固定：建系、算坐标、求法向量、点积算夹角。这题最容易错的地方是Q和R的位置——注意题目给的是A一Q等于二AQ，不是AQ等于二倍A一Q，别搞反了。
    show:
      type: takeaway
      body: 向量法求面面角：建系 $\to$ 坐标 $\to$ 法向量 $\to$ $\cos\theta = \dfrac{|\vec{n}_1\cdot\vec{n}_2|}{|\vec{n}_1||\vec{n}_2|}$
