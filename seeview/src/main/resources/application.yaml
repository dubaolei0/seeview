server:
  port: 8899

spring:
  application:
    name: seeview
  # AI 生题答案/解析插图上传上限（与后端单图 20MB 校验对齐）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

manim:
  # 本地子进程渲染（see 工程自包含 lecture_pipeline 引擎）
  python: ${user.dir}/lecture_pipeline/.venv/Scripts/python.exe
  engine-dir: ${user.dir}/lecture_pipeline
  timeout: 600s
  connect-timeout: 10s
  # 阿里云 CosyVoice TTS key（通过环境变量传给 python 子进程）；仅前端选阿里云音色时需要
  dashscope-key: sk-15ec617f62464094abd7180ad7a1e20c
  # 豆包 TTS 凭据（默认音色走豆包，通过环境变量 DOUBAO_APPID/DOUBAO_TOKEN 传给 python 子进程）
  # 获取地址：https://console.volcengine.com/speech/service/8（语音合成 seed-tts-2.0）
  doubao-appid: '2128185590'
  doubao-token: 'MFi0sNi-Mf2DyiiaFehx-8YfZPWtQ-uR'
  # 豆包集群，缺省 seed-tts-2.0，可不配
  # doubao-cluster: seed-tts-2.0

  # 远程微服务地址（/get 接口走 HTTP 客户端模式时用，本方案默认不走）
  base-url: http://localhost:8000


# AI 生题：题目插图保存目录（远程图片下载、本地图片拷贝到此处，题目内链接改写为副本绝对路径）
question:
  image-dir: ${user.dir}/question_output/images
  # TikZ 配图编译：题干中的 ```tikz 代码块由该 python + 脚本编译为 PNG（xelatex）
  tikz-python: ${user.dir}/lecture_pipeline/.venv/Scripts/python.exe
  tikz-script: ${user.dir}/tools/题目png生成工具/latex_snippet_tool.py
  # 视觉模型（生题时把材料图片懒加载转述为文字，按图片内容哈希缓存到
  # question_output/image_desc_cache；model-name 留空则禁用转述，回退"无法读取"提示）
  vision:
    model-name: deepseek-v4-flash-vision-exp
    api-key: sk-0807477a969a4213a24aaacd89e02724
    base-url: https://api.deepseek.com
    # 单张图片转述读超时（秒）；慢模型 + 重试 1 次时最坏等待约 2 倍
    timeout-seconds: 120

langchain4j:
  open-ai:
    chat-model:
      api-key: sk-bec6f20fa8eae687d5019e5694849cb13816caeeb5d5dcba9d2917d6992de360
      model-name: gpt-5.6
      base-url: https://code.mmkg.cloud/v1

      log-requests: true
      log-responses: true
      # 单次调用读超时：生成长文档（备课/讲稿/yaml，提示词+样例注入后体量较大）常超 60s 默认值
      timeout: 900s
      # 超时/瞬断重试次数（maxRetries=重试次数，不含首次；过大遇慢模型会成倍等待）
      max-retries: 1
      # glm-5.2 是推理模型，默认把输出额度花在 reasoning_content（思考链）上：
      # 长任务（尤其 yaml 步提示词 16k+ token）推理膨胀会吃光 max_tokens，
      # finish_reason=length 且 content 为空。关闭思考直接产出正文
      # （提示词本就面向 sonnet/opus 这类非重推理模型设计）。
#      custom-parameters:
#        thinking:
#          type: disabled
      # 关思考后 max_tokens 全部留给正文；压轴备课/yaml 较长，需足够额度
      max-tokens: 50000

# 讲题视频三段式生成配置
lecture:
  # 三份提示词所在目录（备课.md / 讲稿.md / yaml.md）
  skills-dir: ${user.dir}/skills/讲题视频
  # 三份文档输出目录
  output-dir: ${user.dir}/lecture_output
  # 成员 profile 根目录（team/{姓名}/profile.md），可选
  community-dir: ${user.dir}/community
  # 是否启用 yaml 校验闭环（schema + 裸中文 + normalize_say，复用 manim.python/engine-dir）
  validate: true
  # yaml 校验闭环最大 LLM 修正轮数
  max-fix-rounds: 2
  # 多题批量生成的并发度（每并发一路大模型 + 一路 python 校验子进程）
  batch-concurrency: 3